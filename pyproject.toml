[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "azvnet"
version = "0.1.0"
description = "Checked Azure execution and OpenTofu inside a private VNet"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[project.urls]
Repository = "https://github.com/npiesco/azvnet"

[dependency-groups]
dev = ["ruff==0.14.10", "mypy==1.19.1"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["src/azvnet"]
